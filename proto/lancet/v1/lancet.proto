syntax = "proto3";

package lancet.v1;

option go_package = "github.com/lancet/gateway/proto/lancet/v1;lancetv1";

service LancetService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc IngestDocument(stream IngestDocumentRequest) returns (IngestDocumentResponse);
  rpc GetIngestionStatus(GetIngestionStatusRequest) returns (GetIngestionStatusResponse);
  rpc QueryRAG(QueryRAGRequest) returns (stream WorkflowEvent);
  rpc QueryGraph(QueryGraphRequest) returns (QueryGraphResponse);
}

message PingRequest {
  string value = 1;
}

message PingResponse {
  string value = 1;
  int64 timestamp = 2;
}

message IngestDocumentRequest {
  string document_id = 1;
  string filename = 2;
  bytes chunk_data = 3;
  map<string, string> metadata = 4;
}

message IngestDocumentResponse {
  string document_id = 1;
  bool success = 2;
  string message = 3;
}

message GetIngestionStatusRequest {
  string document_id = 1;
}

message GetIngestionStatusResponse {
  string document_id = 1;
  string status = 2;
  int32 chunk_count = 3;
  string error_message = 4;
}

message DocumentFilter {
  repeated string document_ids = 1;
  repeated string content_types = 2;
}

message QueryRAGRequest {
  string query = 1;
  string session_id = 2;
  DocumentFilter filter = 3;

  // D-10/D-12. `optional` for FIELD PRESENCE, deliberately: absent means
  // "use the engine's configured default"; false means "explicitly off".
  // A plain bool cannot express that, and D-12 is config-default + per-request override.
  optional bool allow_model_only = 4;

  // D-47. STRICTLY DISTINCT from allow_model_only — "without graph" != "without evidence".
  // Names what it turns OFF because the graph node has no disable path today, so this
  // field is what produces 6.3's `graph-off` arm. `graph-on` is the absent/false state.
  optional bool disable_graph_context = 5;
}

// D-76. The enum is CANONICAL; `Notice.code` (string) is DERIVED from it by one mapping
// function and retained for forward compatibility, exactly as D-76 specifies.
// Values 1-3 already exist as wire strings today and MUST keep their spellings.
enum NoticeCode {
  NOTICE_CODE_UNSPECIFIED = 0;

  // ── already emitted today; string values unchanged ────────────────────────
  NOTICE_CODE_NO_EVIDENCE = 1;
  NOTICE_CODE_GRAPH_TIMEOUT = 2;
  NOTICE_CODE_GRAPH_DEGRADED = 3;
  // The two CONTENTLESS codes update_from_model_output() emits today
  // (workflow/mod.rs:117,124) — on the published wire, so they are named, not dropped.
  NOTICE_CODE_MODEL_NOTICE = 4;
  NOTICE_CODE_MODEL_WARNING = 5;

  // ── Phase 6 ───────────────────────────────────────────────────────────────
  NOTICE_CODE_GRAPH_UNAVAILABLE = 10;
  NOTICE_CODE_RETRIEVAL_DEGRADED_DENSE = 11;
  NOTICE_CODE_CITATION_REPAIRED = 12;
  NOTICE_CODE_CITATION_DROPPED = 13;
  NOTICE_CODE_MODEL_ONLY = 14;
  NOTICE_CODE_BASIS_RECONCILED = 15;
  NOTICE_CODE_RETRIEVAL_DEGRADED_BM25 = 16;
  reserved 17; // Tag 17 reserved: in-fusion graph retrieval is unreachable (hybrid retrieval holds no graph port)
  NOTICE_CODE_GRAPH_ABLATION = 18;

  // ── RESERVED FOR PHASE 6.1 (D-24/D-25), declared HERE on purpose ──────────
  NOTICE_CODE_INDEX_REBUILD_FAILED = 20;
  NOTICE_CODE_INDEX_STALE = 21;
  NOTICE_CODE_INDEX_GENERATION_MISMATCH = 22;
}

enum AnswerBasis {
  ANSWER_BASIS_UNSPECIFIED = 0;
  ANSWER_BASIS_RETRIEVAL = 1;
  ANSWER_BASIS_MIXED = 2;
  ANSWER_BASIS_MODEL_ONLY = 3;
}

enum NoticeSeverity {
  NOTICE_SEVERITY_UNSPECIFIED = 0;
  NOTICE_SEVERITY_INFO = 1;
  NOTICE_SEVERITY_WARNING = 2;
  NOTICE_SEVERITY_ERROR = 3;
}

message Notice {
  string code = 1;
  string message = 2;
  NoticeSeverity severity = 3;
  NoticeCode typed_code = 4;
}

message StructuredCitation {
  string chunk_id = 1;
  string document_id = 2;
  string title = 3;
  string section_path = 4;
  string excerpt = 5;
  bool is_truncated = 6;
  double score = 7;
  int32 rank = 8;
  string content_type = 9;
}

message RetrievalSnapshot {
  string index_generation = 1;
  string embedding_model = 2;
  double vector_weight = 3;
  double bm25_weight = 4;
  int32 rrf_k = 5;
  int32 candidate_limit = 6;
  int32 final_limit = 7;
  DocumentFilter active_filter = 8;
  string result_hash = 9;
  uint32 variant_count = 10;
  repeated string variant_identities = 11;
}

message QueryRAGResponse {
  string answer = 1;
  repeated string citations = 2;
  string session_id = 3;
  AnswerBasis answer_basis = 4;
  repeated StructuredCitation structured_citations = 5;
  repeated Notice notices = 6;
  RetrievalSnapshot snapshot = 7;
}

message QueryGraphRequest {
  string seed_entity_id = 1;
  string seed_entity_name = 2;
  uint32 hop_depth = 3;
  string relation_type_filter = 4;
}

message QueryGraphNode {
  string entity_id = 1;
  string name = 2;
  string entity_type = 3;
}

message QueryGraphEdge {
  string source_entity_id = 1;
  string target_entity_id = 2;
  string relation_type = 3;
  float weight = 4;
}

message QueryGraphResponse {
  repeated QueryGraphNode nodes = 1;
  repeated QueryGraphEdge edges = 2;
}

enum NodeErrorKind {
  NODE_ERROR_KIND_UNSPECIFIED = 0;
  NODE_ERROR_KIND_TIMEOUT = 1;
  NODE_ERROR_KIND_CANCELLED = 2;
  NODE_ERROR_KIND_LLM_GENERATION_FAILED = 3;
  NODE_ERROR_KIND_RETRIEVAL_FAILED = 4;
  NODE_ERROR_KIND_GRAPH_FAILED = 5;
  NODE_ERROR_KIND_PROMPT_ASSEMBLY_FAILED = 6;
  NODE_ERROR_KIND_REFORMULATION_FAILED = 7;
  NODE_ERROR_KIND_INTERNAL = 8;
  NODE_ERROR_KIND_INPUT_VALIDATION = 9;
}

message NodeStartedEvent {
  string node_name = 1;
  string inputs_summary = 2;
}

message NodeCompletedEvent {
  string node_name = 1;
  string outputs_summary = 2;
  int64 duration_ms = 3;
}

message NodeFailedEvent {
  string node_name = 1;
  NodeErrorKind category = 2;
  string message = 3;
  bool retryable = 4;
}

message AnswerChunkEvent {
  string chunk = 1;
  bool is_final = 2;
}

message FinalAnswerEvent {
  QueryRAGResponse response = 1;
}

message CheckpointEvent {
  string checkpoint_type = 1;
  uint64 sequence_ordinal = 2;
  string context_snapshot = 3;
}

// D-41 + Phase 05 D-30. One nested message = one additive tag, matching Phase 05's
// tags 10/11 pattern. The field list is D-30's, verbatim, not re-derived.
message WorkflowMetadata {
  int64 started_at_ms = 1;
  int64 completed_at_ms = 2;
  bool reformulation_used = 3;
  uint32 vector_count = 4;
  uint32 bm25_count = 5;
  uint32 graph_node_count = 6;
  uint32 graph_edge_count = 7;
  uint32 prompt_tokens = 8;
  uint32 completion_tokens = 9;
  // DERIVED, never independently set — see the derivation rule.
  bool degraded_mode = 10;
}

message WorkflowCompletedEvent {
  bool success = 1;
  int64 duration_ms = 2;
  NodeErrorKind error_kind = 3;
  string error_message = 4;
  QueryRAGResponse final_response = 5;
  repeated Notice notices = 6;
  WorkflowMetadata metadata = 7; // NEW (D-41)
}

message WorkflowEvent {
  string trace_id = 1;
  string session_id = 2;
  uint64 sequence_ordinal = 3;
  int64 timestamp_ms = 4;
  oneof event {
    NodeStartedEvent node_started = 5;
    NodeCompletedEvent node_completed = 6;
    NodeFailedEvent node_failed = 7;
    AnswerChunkEvent answer_chunk = 8;
    FinalAnswerEvent final_answer = 9;
    CheckpointEvent checkpoint = 10;
    WorkflowCompletedEvent workflow_completed = 11;
  }
}
