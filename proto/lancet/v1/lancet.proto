syntax = "proto3";

package lancet.v1;

option go_package = "github.com/lancet/gateway/proto/lancet/v1;lancetv1";

service LancetService {
  rpc Ping(PingRequest) returns (PingResponse);
  rpc IngestDocument(stream IngestDocumentRequest) returns (IngestDocumentResponse);
  rpc GetIngestionStatus(GetIngestionStatusRequest) returns (GetIngestionStatusResponse);
  rpc QueryRAG(QueryRAGRequest) returns (stream WorkflowEvent);
  rpc QueryGraph(QueryGraphRequest) returns (QueryGraphResponse);
}

message PingRequest {
  string value = 1;
}

message PingResponse {
  string value = 1;
  int64 timestamp = 2;
}

message IngestDocumentRequest {
  string document_id = 1;
  string filename = 2;
  bytes chunk_data = 3;
  map<string, string> metadata = 4;
}

message IngestDocumentResponse {
  string document_id = 1;
  bool success = 2;
  string message = 3;
}

message GetIngestionStatusRequest {
  string document_id = 1;
}

message GetIngestionStatusResponse {
  string document_id = 1;
  string status = 2;
  int32 chunk_count = 3;
  string error_message = 4;
}

message DocumentFilter {
  repeated string document_ids = 1;
  repeated string content_types = 2;
}

// 06.3.5 D-99. Which retrieval paths a request runs. Plain enum (not `optional`): proto3's
// zero value already means "absent == default", so UNSPECIFIED behaves exactly as HYBRID and
// the default request stays byte-identical on the wire. A path a mode excludes is SKIPPED, not
// zero-weighted: it is never called and emits no RETRIEVAL_DEGRADED_* notice.
enum RetrievalMode {
  RETRIEVAL_MODE_UNSPECIFIED = 0;
  RETRIEVAL_MODE_HYBRID = 1;
  RETRIEVAL_MODE_DENSE_ONLY = 2;
  RETRIEVAL_MODE_BM25_ONLY = 3;
}

// 06.3.6 D-136. A quality lever a request switches on, named once per request and echoed on
// `RetrievalSnapshot.levers`. Plain enum (not `optional`): an empty `repeated Lever` is the
// absent state, and proto3 writes 0 bytes for it, so the default request stays byte-identical on
// the wire. LEVER_UNSPECIFIED is never a valid member of a request: the engine refuses it, an
// unknown value, a negative value and a duplicate with `invalid_levers`. Numbering is the harness
// `LEVER_ORDER`; a later lever takes the next free number and nothing is renumbered.
enum Lever {
  LEVER_UNSPECIFIED = 0;
  // D-133/D-134: re-orders the fused candidate list with the configured reranker before the final take.
  LEVER_RERANK = 1;
  // D-141: renders per-block evidence metadata into the prompt.
  LEVER_EVIDENCE_METADATA = 2;
  // D-141: asks for a yes/no-shaped final answer line for binary questions.
  LEVER_BINARY_ANSWER_FORMAT = 3;
  // D-137/D-141: the graph repair the committed diagnosis selected (`graph_list_precision`).
  // Refused with `invalid_lever_combination` when `disable_graph_context` is also set (D-165).
  LEVER_GRAPH_V2 = 4;
}

message QueryRAGRequest {
  string query = 1;
  string session_id = 2;
  DocumentFilter filter = 3;

  // D-10/D-12. `optional` for FIELD PRESENCE, deliberately: absent means
  // "use the engine's configured default"; false means "explicitly off".
  // A plain bool cannot express that, and D-12 is config-default + per-request override.
  optional bool allow_model_only = 4;

  // D-47. STRICTLY DISTINCT from allow_model_only — "without graph" != "without evidence".
  // Names what it turns OFF because the graph node has no disable path today, so this
  // field is what produces 6.3's `graph-off` arm. `graph-on` is the absent/false state.
  optional bool disable_graph_context = 5;

  // 06.3.5 D-99. Names the retrieval path set the request runs; UNSPECIFIED (absent) is HYBRID.
  // The chosen value is echoed on `RetrievalSnapshot.retrieval_mode` so a failed record stays attributable.
  RetrievalMode retrieval_mode = 6;

  // 06.3.5 D-100. Opt-in diagnostic: when true the snapshot carries the pre-rerank,
  // pre-truncation candidate ranking (`RetrievalSnapshot.pre_truncation_ranking`, IDs and ranks
  // only, at most `candidate_limit` rows). False/absent leaves the snapshot bytes unchanged.
  bool include_pre_truncation_ranking = 7;

  // 06.3.6 D-136. The quality levers this request switches on; empty == absent == today's request.
  // Echoed canonically (ascending enum number) on `RetrievalSnapshot.levers`.
  repeated Lever levers = 8;
}

// D-76. The enum is CANONICAL; `Notice.code` (string) is DERIVED from it by one mapping
// function and retained for forward compatibility, exactly as D-76 specifies.
// Values 1-3 already exist as wire strings today and MUST keep their spellings.
enum NoticeCode {
  NOTICE_CODE_UNSPECIFIED = 0;

  // ── already emitted today; string values unchanged ────────────────────────
  NOTICE_CODE_NO_EVIDENCE = 1;
  NOTICE_CODE_GRAPH_TIMEOUT = 2;
  NOTICE_CODE_GRAPH_DEGRADED = 3;
  // The two CONTENTLESS codes update_from_model_output() emits today
  // (workflow/mod.rs:117,124) — on the published wire, so they are named, not dropped.
  NOTICE_CODE_MODEL_NOTICE = 4;
  NOTICE_CODE_MODEL_WARNING = 5;

  // ── Phase 6 ───────────────────────────────────────────────────────────────
  NOTICE_CODE_GRAPH_UNAVAILABLE = 10;
  NOTICE_CODE_RETRIEVAL_DEGRADED_DENSE = 11;
  NOTICE_CODE_CITATION_REPAIRED = 12;
  NOTICE_CODE_CITATION_DROPPED = 13;
  NOTICE_CODE_MODEL_ONLY = 14;
  NOTICE_CODE_BASIS_RECONCILED = 15;
  NOTICE_CODE_RETRIEVAL_DEGRADED_BM25 = 16;
  reserved 17; // Tag 17 reserved: in-fusion graph retrieval is unreachable (hybrid retrieval holds no graph port)
  NOTICE_CODE_GRAPH_ABLATION = 18;
  // Tag 19 (D-28): emitted when RetrieveHybrid fails rather than completes.
  // The "completed but matched nothing" case keeps tag 1 (NOTICE_CODE_NO_EVIDENCE).
  NOTICE_CODE_RETRIEVAL_FAILED = 19;

  // ── RESERVED FOR PHASE 6.1 (D-24/D-25), declared HERE on purpose ──────────
  NOTICE_CODE_INDEX_REBUILD_FAILED = 20;
  NOTICE_CODE_INDEX_STALE = 21;
  NOTICE_CODE_INDEX_GENERATION_MISMATCH = 22;

  // ── Phase 06.3.6 ──────────────────────────────────────────────────────────
  // D-134: the reranker was attempted and the fused order was kept. Joins the `degraded_mode` set.
  NOTICE_CODE_RERANK_DEGRADED = 23;
}

enum AnswerBasis {
  ANSWER_BASIS_UNSPECIFIED = 0;
  ANSWER_BASIS_RETRIEVAL = 1;
  ANSWER_BASIS_MIXED = 2;
  ANSWER_BASIS_MODEL_ONLY = 3;
}

enum NoticeSeverity {
  NOTICE_SEVERITY_UNSPECIFIED = 0;
  NOTICE_SEVERITY_INFO = 1;
  NOTICE_SEVERITY_WARNING = 2;
  NOTICE_SEVERITY_ERROR = 3;
}

message Notice {
  string code = 1;
  string message = 2;
  NoticeSeverity severity = 3;
  // D-76: typed counterpart to `code`.
  NoticeCode typed_code = 4;
}

message StructuredCitation {
  string chunk_id = 1;
  string document_id = 2;
  string title = 3;
  string section_path = 4;
  string excerpt = 5;
  bool is_truncated = 6;
  double score = 7;
  int32 rank = 8;
  string content_type = 9;
  // 06.3.4.1 D-81: the graph contributed to this chunk's place in the retrieved set. Set on
  // `RetrievalSnapshot.retrieved_chunks`; always false on the generator's cited chunks.
  bool graph_boosted = 10;
}

// 06.3.5 D-100. One row of the pre-truncation candidate ranking: IDs and ranks only, never
// chunk text. Ranks are 1-based; 0 means the chunk was not in that list.
message RankedCandidate {
  string chunk_id = 1;
  string document_id = 2;
  // Position in the list after the reranker (D-133); equal to the fused position when no rerank lever is set.
  int32 fused_rank = 3;
  int32 vector_rank = 4;
  int32 bm25_rank = 5;
  int32 graph_rank = 6;
  bool graph_boosted = 7;
}

message RetrievalSnapshot {
  string index_generation = 1;
  string embedding_model = 2;
  double vector_weight = 3;
  double bm25_weight = 4;
  int32 rrf_k = 5;
  int32 candidate_limit = 6;
  int32 final_limit = 7;
  DocumentFilter active_filter = 8;
  string result_hash = 9;
  uint32 variant_count = 10;
  repeated string variant_identities = 11;
  // The full ranked retrieval result set independent of what the generator cited.
  repeated StructuredCitation retrieved_chunks = 12;
  // 06.3.5 D-99: echo of `QueryRAGRequest.retrieval_mode`; 0 when the request did not set one.
  RetrievalMode retrieval_mode = 13;
  // 06.3.5 D-100: populated only when the request set `include_pre_truncation_ranking`.
  repeated RankedCandidate pre_truncation_ranking = 14;
  // 06.3.6 D-136: canonical echo of the admitted `QueryRAGRequest.levers`, ascending enum number.
  repeated Lever levers = 15;
}

message QueryRAGResponse {
  string answer = 1;
  repeated string citations = 2;
  string session_id = 3;
  AnswerBasis answer_basis = 4;
  repeated StructuredCitation structured_citations = 5;
  repeated Notice notices = 6;
  RetrievalSnapshot snapshot = 7;
}

message QueryGraphRequest {
  string seed_entity_id = 1;
  string seed_entity_name = 2;
  uint32 hop_depth = 3;
  string relation_type_filter = 4;
}

message QueryGraphNode {
  string entity_id = 1;
  string name = 2;
  string entity_type = 3;
}

message QueryGraphEdge {
  string source_entity_id = 1;
  string target_entity_id = 2;
  string relation_type = 3;
  float weight = 4;
}

message QueryGraphResponse {
  repeated QueryGraphNode nodes = 1;
  repeated QueryGraphEdge edges = 2;
}

enum NodeErrorKind {
  NODE_ERROR_KIND_UNSPECIFIED = 0;
  NODE_ERROR_KIND_TIMEOUT = 1;
  NODE_ERROR_KIND_CANCELLED = 2;
  NODE_ERROR_KIND_LLM_GENERATION_FAILED = 3;
  NODE_ERROR_KIND_RETRIEVAL_FAILED = 4;
  NODE_ERROR_KIND_GRAPH_FAILED = 5;
  NODE_ERROR_KIND_PROMPT_ASSEMBLY_FAILED = 6;
  NODE_ERROR_KIND_REFORMULATION_FAILED = 7;
  NODE_ERROR_KIND_INTERNAL = 8;
  NODE_ERROR_KIND_INPUT_VALIDATION = 9;
}

message NodeStartedEvent {
  string node_name = 1;
  string inputs_summary = 2;
}

message NodeCompletedEvent {
  string node_name = 1;
  string outputs_summary = 2;
  int64 duration_ms = 3;
}

message NodeFailedEvent {
  string node_name = 1;
  NodeErrorKind category = 2;
  string message = 3;
  bool retryable = 4;
}

message AnswerChunkEvent {
  string chunk = 1;
  bool is_final = 2;
}

message FinalAnswerEvent {
  QueryRAGResponse response = 1;
}

message CheckpointEvent {
  string checkpoint_type = 1;
  uint64 sequence_ordinal = 2;
  string context_snapshot = 3;
}

// D-41 + Phase 05 D-30. One nested message = one additive tag, matching Phase 05's
// tags 10/11 pattern. The field list is D-30's, verbatim, not re-derived.
message WorkflowMetadata {
  int64 started_at_ms = 1;
  int64 completed_at_ms = 2;
  bool reformulation_used = 3;
  uint32 vector_count = 4;
  uint32 bm25_count = 5;
  uint32 graph_node_count = 6;
  uint32 graph_edge_count = 7;
  uint32 prompt_tokens = 8;
  uint32 completion_tokens = 9;
  // DERIVED, never independently set — see the derivation rule.
  bool degraded_mode = 10;
  // D-06: counts graph-derived facts that reached the assembled prompt (influence),
  // which is distinct from the presence counters at tags 6 and 7.
  uint32 graph_prompt_fact_count = 11;
  // 06.3.4.1 D-79: seeds the question's mentions matched. Counts, a boolean and document IDs only;
  // never question text or entity names.
  uint32 graph_seed_count = 12;
  // 06.3.4.1 D-79: at least one seed-to-seed path was found.
  bool graph_path_found = 13;
  // 06.3.4.1 D-81: chunks of the final retrieved set the graph list contributed to.
  uint32 graph_boosted_chunk_count = 14;
  // 06.3.4.1 D-79: two-hop paths dropped for an intermediate entity above the degree cap.
  uint32 graph_degree_capped_count = 15;
  // 06.3.4.1 D-79: document IDs of the seeds' source chunks, sorted and de-duplicated, so
  // column (d) can be computed per record. Not capped: bounded by max_seeds and the corpus
  // document count (at most 88 IDs per question on the 100-question probe).
  repeated string graph_seed_document_ids = 16;
  // 06.3.6 D-134: set only when a rerank was attempted (the rerank lever was admitted and the
  // reranker was called); unset otherwise.
  RerankMetadata rerank = 17;
  // 06.3.6 D-52: retries spent re-embedding the query after a retryable embedding failure; zero is
  // omitted on the wire.
  uint32 query_embedding_retries = 18;
}

// 06.3.6 D-134. How a rerank attempt ended. UNSPECIFIED is never set by the engine.
enum RerankOutcome {
  RERANK_OUTCOME_UNSPECIFIED = 0;
  RERANK_OUTCOME_COMPLETED = 1;
  RERANK_OUTCOME_DEGRADED_TIMEOUT = 2;
  RERANK_OUTCOME_DEGRADED_STATUS = 3;
  RERANK_OUTCOME_DEGRADED_MALFORMED = 4;
  RERANK_OUTCOME_DEGRADED_TRANSPORT = 5;
}

// 06.3.6 D-134. Latency and cost of one rerank attempt. Counts, numbers and an outcome only;
// never query text or document text.
message RerankMetadata {
  uint32 latency_ms = 1;
  double cost_credits = 2;
  // False when the provider reported no cost; `cost_credits` is then 0 and means "unknown".
  bool cost_reported = 3;
  RerankOutcome outcome = 4;
}

message WorkflowCompletedEvent {
  bool success = 1;
  int64 duration_ms = 2;
  NodeErrorKind error_kind = 3;
  string error_message = 4;
  QueryRAGResponse final_response = 5;
  repeated Notice notices = 6;
  WorkflowMetadata metadata = 7; // NEW (D-41)
  // D-33: carries retrieval provenance on a terminal where final_response is absent,
  // so a failed query is still attributable to an index generation.
  RetrievalSnapshot partial_snapshot = 8;
}

message WorkflowEvent {
  string trace_id = 1;
  string session_id = 2;
  uint64 sequence_ordinal = 3;
  int64 timestamp_ms = 4;
  oneof event {
    NodeStartedEvent node_started = 5;
    NodeCompletedEvent node_completed = 6;
    NodeFailedEvent node_failed = 7;
    AnswerChunkEvent answer_chunk = 8;
    FinalAnswerEvent final_answer = 9;
    CheckpointEvent checkpoint = 10;
    WorkflowCompletedEvent workflow_completed = 11;
  }
}
