[project]
name = "lancet-llamaindex"
version = "0.1.0"
description = "LlamaIndex paper-configuration baseline that writes a Lancet context export (D-248)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28.1",
    "lancet-eval",
    "llama-index-core==0.14.25",
]

[project.scripts]
lancet-llamaindex = "lancet_llamaindex.cli:main"

[tool.uv.sources]
lancet-eval = { path = "../../eval", editable = true }

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.ruff]
target-version = "py313"
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PLW1514"]
