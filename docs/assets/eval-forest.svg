<title id="forest-title">Paired deltas against the same-day hybrid, held-out MultiHop-RAG</title>
<desc id="forest-desc">Forest plot of paired deltas with 95% bootstrap confidence intervals on answer_usable and paper-convention Hits@4. Holm-significant rows are filled, descriptive rows are diamonds, and the two lever arms outside the Hits@4 family carry a footnote instead of a number.</desc>
