[project]
name = "lancet-eval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "user39261580", email = "user39261580@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
    "jinja2>=3.1.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "tenacity>=9.1",
    "typer>=0.27.2",
]

[project.scripts]
lancet-eval = "lancet_eval.cli:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-httpx>=0.36.2",
    "ruff>=0.16.5",
]

[tool.ruff]
target-version = "py313"
preview = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PLW1514"]
