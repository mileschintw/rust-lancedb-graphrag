# #163 (D-291): column `closed-book` of RUN_PLAN_S3_HELDOUT, S3's held-out reader grid
# on 2Wiki, over the 900 held-out questions of the D-243 split.
# Its context is the question alone: `lancet-eval closed-book-init` writes one
# model-only row per question, and `batch submit` sends deepseek's replicates 1 and 2
# and the readers' answers over them. No drive.
#
# No run of this corpus is scored or read for its answers before the grid's analysis
# plan is frozen: score, compare-levers and both readouts refuse it (D-291). Run guide:
# experiments/v1.1/RUN-S3-HELDOUT.md.
#
# The documents file and the questions file hold Wikipedia text, so they stay in
# twowiki/.cache/ and are never committed (ATTRIBUTION.md): `python -m lancet_eval.twowiki
# fetch`, then `python -m lancet_eval.twowiki_b` and `python -m lancet_eval.twowiki_h`
# write them. The documents file is pinned by sha256.
[documents]
map_corpus = "twowiki"
file = "twowiki/.cache/documents.jsonl"
sha256 = "57d038e26b2bfc10bdd91afcde3a2df30a79bad583f9b9f4f2aa3002d744e822"
source = "https://huggingface.co/datasets/osunlp/HippoRAG_2"
license = "apache-2.0"
count = 6119
commit_documents = false
chunk_size = 8192

[questions]
file = "twowiki/.cache/questions.heldout.jsonl"
label_format = "multihop_rag"
sample_seed = 243
sample_size = 900

[arms]
# The column's source arm, then its reader arms (RUN_PLAN_S3_HELDOUT's cells, the
# optional ones included).
arms = [
  "twowiki/closed-book",
  "twowiki/closed-book@haiku-5.5",
  "twowiki/closed-book@sonnet-5.5",
  "twowiki/closed-book@opus-5.5",
]

# Ingested as given: fixed-size windows of 8,192 characters hold every passage (the
# longest is 6,457) in one chunk, so no passage is split.
[stores.twowiki]
chunk_strategy = "fixed-size"
chunk_size = 8192
chunk_overlap = 0

[split]
file = "twowiki/s3h_split.json"
role = "heldout"

[preregistration]
token = "RUN_PLAN_S3_HELDOUT"
column = "closed-book"

[preflight]
legacy_canaries = false
