# #143, exploratory (S2X): S2's readers on S1's merged graph-off arm, at K = 2. It decides
# nothing (experiments/v1.1/EXPLORE-S2-MERGED.md). No drive: `replay-init` carries the
# deepseek records of `merged/hybrid+rerank+metadata` from the S1 run and `batch submit`/
# `fetch` write the reader arms. [documents], [questions], [document_subset], [split] and
# [stores] are copied from multihop_rag_s2_dev.toml, so score reads the same question
# pool and document map (a test pins this).
[documents]
map_corpus = "multihop_rag"
source = "https://huggingface.co/datasets/yixuantt/MultiHopRAG"
license = "odc-by"
count = 609
commit_documents = true
chunk_size = 500

[questions]
file = "multihop_rag/questions.diag.jsonl"
label_format = "multihop_rag"
sample_seed = 42
sample_size = 100

[document_subset]
selection_algorithm = "referenced_plus_distractors"
distractor_count = 25

[arms]
# The carried deepseek arm, then its reader arms, as in multihop_rag_s2_dev.toml.
arms = [
  "merged/hybrid+rerank+metadata",
  "merged/hybrid+rerank+metadata@haiku-5.5",
  "merged/hybrid+rerank+metadata@sonnet-5.5",
  "merged/hybrid+rerank+metadata@opus-5.5",
]

[stores.small]
chunk_strategy = "structure-aware"
chunk_size = 500
chunk_overlap = 50

[stores.merged]
chunk_strategy = "structure-merge"
chunk_size = 256
chunk_overlap = 25

[split]
file = "multihop_rag/heldout_split.json"
role = "dev"

[preregistration]
token = "PREREGISTRATION_S2X"
