[gateway]
port = "8080"
# Supplied via LANCET_GATEWAY__DATABASE_URL; never commit a real DSN.
database_url = ""
engine_addr = "127.0.0.1:50051"

[gateway.telemetry]
# OTLP gRPC endpoint for traces, metrics and logs (D-34, D-38).
otlp_endpoint = "http://127.0.0.1:4317"
# Sampling ratio: 1.0 = always on (D-32).
sampler_ratio = 1.0
# Service name for OTel resource attribution (D-43).
service_name = "lancet-gateway"
# Deployment environment for OTel resource attribution (D-43).
deployment_environment = "dev"

[engine]
grpc_addr = "127.0.0.1:50051"
lancedb_path = "./data/lancedb"

[engine.telemetry]
# OTLP gRPC endpoint for traces, metrics and logs (D-34, D-38).
otlp_endpoint = "http://127.0.0.1:4317"
# Sampling ratio: 1.0 = always on (D-32).
sampler_ratio = 1.0
# Service name for OTel resource attribution (D-43).
service_name = "lancet-engine"
# Deployment environment for OTel resource attribution (D-43).
deployment_environment = "dev"

[engine.workflow]
# Budget nesting and timeout hierarchy (D-17, values re-derived 06.3.3-04):
# Runner-level (top-level) node budgets enforced by WorkflowRunner around a whole node:
# - reformulate_timeout_ms (ReformulateQuery) — retained at 5000; not one of the six derived budgets
# - graph_node_timeout_ms (ExtractGraphContext outer envelope)
# - retrieve_timeout_ms (RetrieveHybrid)
# - prompt_timeout_ms (AssemblePrompt)
# - generation_node_timeout_ms (GenerateAnswer)
#
# Inner budgets enforced inside ExtractGraphContextNode that nest inside graph_node_timeout_ms:
# - query_embedding_timeout_ms (inner embedding generation)
# - graph_operation_timeout_ms (inner graph Cypher traversal / augmentation)
#
# Nesting after 06.3.3-04 (strict inequality, slack ≥ 500ms; engine startup only requires ≥):
# query_embedding (645) + graph_operation (38595) = 39240 nests inside graph_node (45674)
# with slack 6434ms. graph_operation fires first on traversal overrun (non-fatal GRAPH_TIMEOUT);
# the outer graph_node budget can still fire if the envelope exceeds 45674ms.
# retrieve (16647) contains query_embedding (645) with slack 16002ms; query_embedding fires first
# if the inner embedding call overruns.
# Nesting is documented for operator visibility and is NOT enforced at startup (D-17).
# Six derived values: p95 × 1.5 (ceil) except generation_node (provider contract: 2×30s + 5s slack).
reformulate_timeout_ms = 5000
query_embedding_timeout_ms = 15000
retrieve_timeout_ms = 30000
graph_operation_timeout_ms = 40000
graph_node_timeout_ms = 60000
prompt_timeout_ms = 10000
generation_node_timeout_ms = 65000
allow_model_only_answers = false # D-10/D-12
citation_repair_enabled = true # D-14/D-84

[engine.retrieval]
candidate_limit = 32
final_limit = 8
query_max_bytes = 8192
max_document_ids = 100
max_content_types = 16
vector_weight = 1.0
bm25_weight = 1.0
rrf_k = 60.0
evidence_token_budget = 8192
excerpt_max_chars = 512

[engine.retrieval.bm25]
k1 = 1.2
b = 0.75
content_boost = 1.0
title_boost = 2.0
section_boost = 1.5

[openrouter]
embedding_endpoint = "https://openrouter.ai/api/v1/embeddings"
embedding_model = "voyageai/voyage-4-large"
generation_model = "deepseek/deepseek-v4-flash-0731"
embedding_concurrency = 12
extraction_concurrency = 15
chat_endpoint = "https://openrouter.ai/api/v1/chat/completions"
models_endpoint = "https://openrouter.ai/api/v1/models"
generation_timeout_secs = 30
temperature = 0.0
top_p = 1.0
max_output_tokens = 2048
