# S3M writer-grid overlay (#148, LANCET_ENV=eval-s3m-deepseek), for the engine only.
# The v1.0 eval store with the graph read from the s3m_deepseek graph table set
# (entities__s3m_deepseek, entity_edges__s3m_deepseek), which import_graph_extractions builds
# from deepseek's extraction of the store's chunks. Every other table is the store's own.
# The gateway and the harness keep LANCET_ENV=eval.

[engine]
lancedb_path = "./data/lancedb-eval"

[engine.graph]
table_set = "s3m_deepseek"
