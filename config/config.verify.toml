# Shared verification configuration consumed by Phase 02 and Phase 05 test harnesses.
# Consumed by scripts/phase02_live_evidence.py (cross-phase lancedb_path store contract)
# and Phase 05 workflow live timeout verification.

[engine]
lancedb_path = "./data/lancedb-verify-02-06"

[openrouter]
# 3s per attempt so 2 * 3s * 1000 <= generation_node_timeout_ms (7000).
# verify-ingestion.sh only exercises ingest/embeddings, not /rag generation.
# Live GenerateAnswer under LANCET_ENV=verify is expected to fail fast at this
# per-attempt budget (completions in (3s, 7s] that used to race the 7s node
# timer will now fail at the provider client).
generation_timeout_secs = 3

[engine.workflow]
reformulate_timeout_ms = 5000
query_embedding_timeout_ms = 10000
retrieve_timeout_ms = 10000
graph_operation_timeout_ms = 4000
graph_node_timeout_ms = 15000
prompt_timeout_ms = 2000
generation_node_timeout_ms = 7000
