# Copy this file to config.dev.toml or config.prod.toml and adjust it locally.
# Set the OpenRouter credential through the OPENROUTER_API_KEY environment variable;
# never put a real API key in a committed file.

[gateway]
port = "8080"
# Supplied via LANCET_GATEWAY__DATABASE_URL; never commit a real DSN.
database_url = ""
engine_addr = "localhost:50051"

[gateway.telemetry]
# OTLP gRPC endpoint for traces, metrics and logs (D-34, D-38).
otlp_endpoint = "http://127.0.0.1:4317"
# Sampling ratio: 1.0 = always on (D-32).
sampler_ratio = 1.0
# Service name for OTel resource attribution (D-43).
service_name = "lancet-gateway"
# Deployment environment for OTel resource attribution (D-43).
deployment_environment = "dev"

[engine]
grpc_addr = "[::1]:50051"
lancedb_path = "./data/lancedb-dev"

[engine.telemetry]
# OTLP gRPC endpoint for traces, metrics and logs (D-34, D-38).
otlp_endpoint = "http://127.0.0.1:4317"
# Sampling ratio: 1.0 = always on (D-32).
sampler_ratio = 1.0
# Service name for OTel resource attribution (D-43).
service_name = "lancet-engine"
# Deployment environment for OTel resource attribution (D-43).
deployment_environment = "dev"

[engine.workflow]
# Budget nesting and timeout hierarchy (D-17, D-66; written together with the engine/src/config.rs
# defaults at 06.3.4.1-27; derivation trail in 06.3.4.1-BUDGETS.md):
# Runner-level (top-level) node budgets enforced by WorkflowRunner around a whole node:
# - reformulate_timeout_ms (ReformulateQuery) — carried at 5000; never derived
# - graph_node_timeout_ms (ExtractGraphContext outer envelope)
# - retrieve_timeout_ms (RetrieveHybrid; also holds the rerank call, rerank_timeout_ms below)
# - prompt_timeout_ms (AssemblePrompt)
# - generation_node_timeout_ms (GenerateAnswer)
#
# Inner budgets enforced inside ExtractGraphContextNode that nest inside graph_node_timeout_ms:
# - query_embedding_timeout_ms (inner embedding generation)
# - graph_operation_timeout_ms (inner graph Cypher traversal / augmentation)
#
# Nesting (slack 500ms is the committed rule's margin; engine startup requires only >=):
# query_embedding (2000) + graph_operation (2424) = 4424 nests inside graph_node (12500), slack 8076ms
# (graph_node is kept at pass A's value; nesting needs only 4924).
# retrieve (3080) holds the search allowance (294) + rerank (2286) + 500ms slack exactly, and so also clears
# query_embedding (2000) + 500ms.
# Which fires first: the embedding call runs inside ExtractGraphContext, so query_embedding (2000)
# fires first on an embedding overrun and fails the node, which cancels the query. graph_operation
# (2424) fires first on a traversal overrun and degrades to chunk-only context (non-fatal
# GRAPH_TIMEOUT). The outer graph_node (12500) fires only if the whole envelope exceeds 12500ms.
# RetrieveHybrid reads the precomputed embedding, so retrieve (3080) bounds its own search and the rerank call.
#
# Provenance (06.3.4.1-BUDGETS.md): 06.3.3's committed rule (p95 x 1.5, ceil, lifted by nesting)
# run on pass A of 2026-09-28 (320 measured records) with the two inner budgets and the prompt floor
# taken from the user's 2026-09-29 decision at 06.3.4.1-24:
# - query_embedding 2000 is user-stated ("tight embedding, loose graph"), not derived from a
#   non-decaying engine.
# - graph_operation 2424 is derived by budget pass B of 2026-10-06 (06.3.4.1-18, 160 graph-on measured records):
#   p95 1616ms x 1.5 of the graph-on ExtractGraphContext node duration, an upper-bound proxy that
#   includes the query embedding, adopted by the user's decision (was 10000).
# - retrieve 2500 (rule 294) and graph_node 12500 (rule 1062) are pass A's rule values raised by nesting;
#   pass B left both unchanged. 06.3.6 (D-154, O11-A) then raised retrieve to 3080 to hold the derived rerank 2286.
# - prompt 120 is the user's floor as amended by D-93 (was 65, 1.5 x pass A's 43ms maximum): a fresh engine's first query took 78.6ms; the rule alone writes 11ms.
# - generation_node 65000 is the provider contract: 2 x 30s attempts + 5s slack.
# Pass A ran with unfiltered logging, so the measured maxima are slightly generous, which is
# acceptable for timeout ceilings. The defaults in engine/src/config.rs must equal these values
# (unit test workflow_budget_defaults_agree_with_config_files).
# unit=milliseconds; range=>0
reformulate_timeout_ms = 5000
# unit=milliseconds; range=>0
query_embedding_timeout_ms = 2000
# unit=milliseconds; range=>0
retrieve_timeout_ms = 3080
# frozen (D-135, D-154, O11-A via D-184): T = ceil(1.5 x 1524 ms p95), the censoring-aware D-135 derivation of dev read 1
# (censored_above_p95_rank(1), n 99, k 1); it nests only in retrieve 3080 = ceil(294 + 2286 + 500), which is why
# retrieve_timeout_ms moved from 2500 to 3080 for every arm. It was provisionally 1706, the room 2500 left.
# unit=milliseconds; range=>0
rerank_timeout_ms = 2286
# unit=milliseconds; range=>0
graph_operation_timeout_ms = 2424
# unit=milliseconds; range=>0
graph_node_timeout_ms = 12500
# unit=milliseconds; range=>0
prompt_timeout_ms = 120
# unit=milliseconds; range=>0
generation_node_timeout_ms = 65000

[engine.retrieval]
# unit=count; range=1..=500
candidate_limit = 32
# unit=count; range=1..=100
final_limit = 8
# unit=UTF-8 bytes; range=1..=8192
query_max_bytes = 8192
# unit=count; range=1..=100
max_document_ids = 100
# unit=count; range=1..=100
max_content_types = 16
# unit=unitless; range=finite 0.0..=16.0 and combined >0
vector_weight = 1.0
# unit=unitless; range=finite 0.0..=16.0 and combined >0
bm25_weight = 1.0
# unit=unitless; range=finite 0.0..=16.0
graph_weight = 1.0
# D-76: weight of the graph chunk list in retrieval fusion (06.3.4.1-15). It equals vector_weight,
# so a chunk the graph found counts like one dense hit; 0.0 ignores the graph list. This is not
# graph_weight above, which is the prompt-packing weight of graph facts (D-30).
# unit=unitless; range=finite 0.0..=16.0
graph_rrf_weight = 1.0
# unit=rank constant; range=integer 1.0..=1000000.0
rrf_k = 60.0
# unit=tokens; range=>0
evidence_token_budget = 8192
# unit=Unicode characters; range=>0
excerpt_max_chars = 512

[engine.retrieval.bm25]
# unit=unitless; range=finite >0
k1 = 1.2
# unit=unitless; range=finite 0..=1
b = 0.75
# unit=unitless; range=finite >0
content_boost = 1.0
# unit=unitless; range=finite >0
title_boost = 2.0
# unit=unitless; range=finite >0
section_boost = 1.5

[engine.graph]
# unit=unitless; range=finite 0.0..=1.0
seed_match_min_score = 0.5
# unit=count; range=1..=3
max_hop_cap = 3
# D-77 graph settings (06.3.4.1-14). Written together with the defaults in engine/src/config.rs and
# with config/config.example.toml; the three are checked for agreement by a unit test. The
# derivation of each value is in the doc comment of its default function in engine/src/config.rs.
# - max_seeds 6: RESEARCH F.1 and the offline probe (mean 4.54 seeds, 39 of 100 questions at 6); 15 pairs.
# - mention_vector_top_k 3: RESEARCH F.1; the vector fallback gave 19.4% of probe seeds.
# - degree_cap 33: p99 of the reconciled eval store degree distribution (27,855 entities).
# - max_path_facts 8: min(16, floor(0.10 * (8192 - 2048) / 69)); 69 is the measured p95 tokens per fact.
# - max_graph_chunk_candidates 8: equals retrieval.final_limit.
# unit=count; range=>0
max_seeds = 6
# unit=count; range=any count; 0 turns the vector fallback off
mention_vector_top_k = 3
# unit=count (entity degree); range=>0
degree_cap = 33
# unit=count; range=>0
max_path_facts = 8
# unit=count; range=any count; keep equal to final_limit
max_graph_chunk_candidates = 8
# D-139: the variant was chosen on dev (read 1 EdgeEvidence beat read 2 MultiCited(2)) and frozen in the D-154 commit
# unit=variant name; range=all | edge_evidence | multi_cited
graph_v2_chunk_precision = "edge_evidence"

[openrouter]
# unit=URL string; range=nonblank
embedding_endpoint = "https://openrouter.ai/api/v1/embeddings"
# unit=provider identifier; range=nonblank
embedding_model = "voyageai/voyage-4-large"
# unit=provider identifier; range=nonblank
generation_model = "openai/gpt-4o-mini"
# unit=count; range=1..=64
embedding_concurrency = 12
# unit=count; range=1..=64
extraction_concurrency = 15
# unit=URL string; range=nonblank
chat_endpoint = "https://openrouter.ai/api/v1/chat/completions"
# unit=URL string; range=nonblank
models_endpoint = "https://openrouter.ai/api/v1/models"
# unit=URL string; range=nonblank
rerank_endpoint = "https://openrouter.ai/api/v1/rerank"
# unit=provider identifier; range=nonblank
rerank_model = "voyageai/rerank-2.5-lite"
# unit=seconds; range=>0
generation_timeout_secs = 30
# unit=unitless; range=finite 0..2
temperature = 0.0
# unit=unitless; range=finite 0..1
top_p = 1.0
# unit=tokens; range=>0
max_output_tokens = 2048
# D-191: generation is pinned to Sail Research with fallbacks off, the 06.3.5 reference provider (amends D-96).
# An empty list sends no pin. Not environment-overridable; rerank keeps its own D-131 body.
# unit=provider slugs; range=empty, or unique entries of 1..=64 chars without whitespace
generation_provider_order = ["sail-research"]
