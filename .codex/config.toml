# GSD Agent Configuration — managed by gsd-core installer
# GSD codex_hooks ownership: section

model = "gpt-5.6-luna"
model_reasoning_effort = "max"

developer_instructions = """
Use Luna at max reasoning for normal work.
Consult GPT-5.6 Sol at high reasoning for architecture, difficult bugs,
security, data consistency, major refactors, tradeoffs, and risky final reviews.
Ask for approval before entering hard-thinking mode unless the user requested it.
"""

[features]
hooks = true

[agents]
max_depth = 1
enabled = true
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"
